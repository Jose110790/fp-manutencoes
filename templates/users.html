{% extends "base.html" %}{% block content %}<div class="head"><div><h1>Usuários</h1><p class="muted">Cadastre equipe própria e responsáveis.</p></div></div><div class="card"><h2>Novo usuário</h2><form method="post"><div class="row"><div class="field"><label>Nome *</label><input name="name" required></div><div class="field"><label>Perfil *</label><select name="role"><option>Gestora</option><option>Zelador</option><option>Funcionário</option><option>Técnico de manutenção</option></select></div><div class="field"><label>Telefone/WhatsApp</label><input name="phone"></div><div class="field"><label>E-mail</label><input name="email" type="email"></div></div><button>Cadastrar usuário</button></form></div><div class="card"><h2>Equipe cadastrada</h2><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Telefone</th><th>E-mail</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td><span class="pill">{{ u.role }}</span></td><td>{{ u.phone or '—' }}</td><td>{{ u.email or '—' }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
