{% extends "base.html" %}{% block content %}<div class="card login"><h1>Alterar minha senha</h1><p class="muted">Use uma senha exclusiva com pelo menos 10 caracteres.</p><form method="post"><div class="field"><label>Senha atual</label><input name="old_password" type="password" autocomplete="current-password" required></div><div class="field"><label>Nova senha</label><input name="new_password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirmar nova senha</label><input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></div><button>Alterar senha</button></form></div>{% endblock %}
